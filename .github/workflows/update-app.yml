name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update VSCodium
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const upstream = { owner: 'VSCodium', repo: 'vscodium' };
            const unstablePattern = /(alpha|beta|preview|rc)/i;

            function compareVersions(left, right) {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              for (let i = 0; i < Math.max(leftParts.length, rightParts.length); i++) {
                const diff = (leftParts[i] || 0) - (rightParts[i] || 0);
                if (diff !== 0) {
                  return diff;
                }
              }
              return 0;
            }

            function candidateFromRelease(release) {
              if (release.draft || release.prerelease || unstablePattern.test(`${release.name || ''} ${release.tag_name || ''}`)) {
                return null;
              }
              if (!/^\d+(?:\.\d+){2,3}$/.test(release.tag_name)) {
                return null;
              }
              const archiveName = `VSCodium-win32-x64-${release.tag_name}.zip`;
              const asset = (release.assets || []).find(asset => asset.name === archiveName);
              return asset ? { version: release.tag_name, downloadUrl: asset.browser_download_url, publishedAt: release.published_at } : null;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...upstream,
              per_page: 100
            });
            const candidates = releases.map(candidateFromRelease).filter(Boolean);
            if (candidates.length === 0) {
              throw new Error('No stable VSCodium Windows x64 ZIP release found');
            }
            candidates.sort((left, right) =>
              compareVersions(left.version, right.version) || new Date(left.publishedAt) - new Date(right.publishedAt));
            const latest = candidates.at(-1);
            core.info(`Resolved latest stable VSCodium archive: ${JSON.stringify(latest)}`);

            const file = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const currentContent = fs.readFileSync(file, 'utf8');

            function propertyValue(name) {
              const match = currentContent.match(new RegExp(`^${name.replaceAll('.', '\\.')}[ \\t]*=[ \\t]*([^\\r\\n]+)`, 'm'));
              if (!match) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return match[1].trim();
            }

            function replaceProperty(content, name, value) {
              const pattern = new RegExp(`^(${name.replaceAll('.', '\\.')}[ \\t]*=[ \\t]*)[^\\r\\n]+`, 'm');
              return content.replace(pattern, (_, prefix) => `${prefix}${value}`);
            }

            const currentVersion = propertyValue('app.version');
            const currentRelease = Number(propertyValue('app.release'));
            if (!/^\d+(?:\.\d+){2,3}$/.test(currentVersion) || !Number.isInteger(currentRelease)) {
              throw new Error('Invalid app.version or app.release in build.properties');
            }
            if (compareVersions(latest.version, currentVersion) < 0) {
              throw new Error(`Latest upstream version ${latest.version} is older than current ${currentVersion}`);
            }

            let updatedContent = replaceProperty(currentContent, 'app.version', latest.version);
            updatedContent = replaceProperty(updatedContent, 'atf.win64.url', latest.downloadUrl);
            if (updatedContent !== currentContent) {
              updatedContent = replaceProperty(updatedContent, 'app.release', String(currentRelease + 1));
              fs.writeFileSync(file, updatedContent, 'utf8');
              core.info('Updated build.properties');
            } else {
              core.info('build.properties is already up to date');
            }

            core.setOutput('title', `VSCodium ${latest.version}`);
            core.setOutput('version', latest.version);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-vscodium
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates VSCodium to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update VSCodium
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
